<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete - Pedido</title>
    <link rel="stylesheet" href="../Lanchonete_Eliel/css/style.css">
</head>
<body>
    <header>
        <h1>🍔 Mandy's Lanchonete ☕</h1>
        <p>Faça seu pedido e confira nosso cardápio.</p>
    </header>

    <main>
        <section id="cardapio">
            <h2>Cardápio</h2>
            <div id="lista-itens" class="grid-cardapio">
                <p>Carregando cardápio...</p>
            </div>
        </section>
        
        <section id="carrinho">
            <h2>🛒 Seu Pedido</h2>
            <div id="itens-carrinho">
                <p>Nenhum item no carrinho.</p>
            </div>
            
            <p class="total">Total: R$ <span id="valor-total">0.00</span></p>

            <div class="form-venda">
                <label for="cliente-id">ID do Cliente (Opcional):</label>
                <input type="text" id="cliente-id" placeholder="Deixe em branco para Cliente Padrão">
                
                <button onclick="finalizarVenda()" id="btn-finalizar">Finalizar Pedido</button>
            </div>
        </section>

        <p style="margin-top: 20px;"><a href="admin.html" target="_blank">Área de Consultas/Admin (A ser implementada)</a></p>

    </main>

    <script src="../Lanchonete_Eliel/js/script.js"></script>
</body>
</html>
